name: Release

# Every push to main builds and publishes a release for all platforms:
# macOS (DMG), Windows (MSI), Linux (DEB, RPM, Arch) and Android (APK).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Releases run one after another, never in parallel
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  checks: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Unit tests
        run: ./gradlew :shared:jvmTest

      # Failed tests show up as annotations on the run
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'shared/build/test-results/**/*.xml'
          annotate_only: true

  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Willhaben Updater ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build DMG
        run: ./gradlew :desktopApp:packageReleaseDmg -PappVersion=$APP_VERSION

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: desktopApp/build/compose/binaries/main-release/dmg/*.dmg

  windows:
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build MSI
        run: ./gradlew :desktopApp:packageReleaseMsi -PappVersion=$APP_VERSION

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: desktopApp/build/compose/binaries/main-release/msi/*.msi

  linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Build DEB and RPM
        run: ./gradlew :desktopApp:packageReleaseDeb :desktopApp:packageReleaseRpm -PappVersion=$APP_VERSION

      # Arch package built natively with makepkg inside an Arch Linux container, from the DEB contents
      - name: Build Arch package
        run: |
          mkdir -p arch-build
          DEB_FILE=$(ls desktopApp/build/compose/binaries/main-release/deb/*.deb | head -n 1)
          cp "$DEB_FILE" arch-build/app.deb

          cat << EOF > arch-build/PKGBUILD
          pkgname=willhaben-updater
          pkgver=${APP_VERSION}
          pkgrel=1
          pkgdesc="Manage willhaben listings locally"
          arch=('x86_64')
          options=(!debug !strip)
          depends=('alsa-lib' 'freetype2' 'fontconfig' 'glibc' 'libx11' 'libxext' 'libxi' 'libxrender' 'libxtst' 'xdg-utils' 'zlib')
          source=("app.deb")
          md5sums=('SKIP')

          prepare() {
              bsdtar -xf app.deb
          }

          package() {
              bsdtar -xf data.tar.* -C "\$pkgdir/"
              install -d "\$pkgdir/usr/bin" "\$pkgdir/usr/share/applications"
              ln -s "/opt/willhaben-updater/bin/Willhaben Updater" "\$pkgdir/usr/bin/willhaben-updater"
              rm -f "\$pkgdir"/opt/willhaben-updater/lib/*.desktop
              printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Willhaben Updater' \
                  'Exec=/usr/bin/willhaben-updater' 'Categories=Office;' 'Terminal=false' \
                  > "\$pkgdir/usr/share/applications/willhaben-updater.desktop"
          }
          EOF

          docker run --rm -v "$(pwd)/arch-build:/build" archlinux:base-devel \
            bash -c "useradd -m builduser && chown -R builduser:builduser /build && su - builduser -c 'cd /build && makepkg -fd'"

          mkdir -p desktopApp/build/compose/binaries/main-release/arch
          cp arch-build/*.pkg.tar.zst desktopApp/build/compose/binaries/main-release/arch/

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: |
            desktopApp/build/compose/binaries/main-release/deb/*.deb
            desktopApp/build/compose/binaries/main-release/rpm/*.rpm
            desktopApp/build/compose/binaries/main-release/arch/*.pkg.tar.*

  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # Signed with the sideload key in androidApp/sideload.keystore, so updates install over older versions
      - name: Build APK
        run: ./gradlew :androidApp:assembleRelease -PappVersion=$APP_VERSION -PappVersionCode=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p release-apk
          cp androidApp/build/outputs/apk/release/*.apk "release-apk/willhaben-updater-${APP_VERSION}.apk"

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: release-apk/*.apk
