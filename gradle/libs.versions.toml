[versions]
navigationevent = "1.1.0"
twelvemonkeys = "3.12.0"
# Build tooling
agp = "9.4.1"                           # Android Gradle Plugin
kotlin = "2.4.21"                       # Kotlin compiler
ksp = "2.3.12"                           # Kotlin Symbol Processing (Room compiler)

# Android
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
androidx-activity = "1.13.0"            # Activity Compose integration (Android entry point)
androidx-appcompat = "1.8.0"
androidx-core = "1.19.1"
androidx-espresso = "3.7.0"
androidx-testExt = "1.3.0"

# Compose
composeMultiplatform = "1.12.2"         # JetBrains Compose Multiplatform
material3 = "1.12.0-alpha03"            # Compose Material 3
materialIconsExtended = "1.7.3"         # Material icon set
androidx-lifecycle = "2.11.0"           # ViewModel + lifecycle-aware Compose helpers
cmpNavigation3 = "1.1.2"                # Navigation 3 for Compose Multiplatform

# Database
room = "2.8.5"                          # Room ORM
sqlite = "2.7.1"                        # Bundled SQLite engine

# DI
koin-core = "4.2.2"                     # Koin DI framework

# Local storage
datastore = "1.2.1"                     # Jetpack DataStore
ksafe = "3.3.0"                         # Encrypted key-value storage (session cookies)

# Async / time
kotlinx-coroutines = "1.11.0"           # Coroutines core + Swing main dispatcher
kotlinx-datetime = "0.8.0"              # Multiplatform date/time formatting
kotlinxIo = "0.9.1"                     # Multiplatform file IO (category tree cache)

# Networking
ktor = "3.6.0"                          # Ktor HTTP client
javafx = "26.0.2"                       # JavaFX WebView for the willhaben login window (desktop)

# Images
coilCompose = "3.6.3"                   # Coil image loader for Compose
reorderable = "3.1.0"                   # Drag-to-reorder for lazy lists/grids

# Testing
junit = "4.13.2"
turbine = "1.2.1"                       # Flow testing
assertk = "0.28.1"                      # Fluent assertions

[libraries]
navigationevent-compose = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "navigationevent" } # System back (Android) in common code
twelvemonkeys-imageio-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "twelvemonkeys" } # WebP reader for ImageIO (willhaben images are WebP)
# --- Testing ---
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }                     # kotlin.test on the JUnit 5 platform (desktop tests)
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" } # runTest + test dispatchers
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }                                               # StateFlow / event Flow assertions
assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }                                     # Fluent assertions
compose-uiTest = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }                       # Compose UI tests (desktop E2E)
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }                                         # Fake HTTP engine for data source tests
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }

# --- Android ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

# --- Compose ---
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-materialIconsExtended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIconsExtended" } # Icons for buttons and status chips
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# --- Navigation 3 ---
jetbrains-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "cmpNavigation3" }                  # NavDisplay + backstack
jetbrains-lifecycle-viewmodel-nav3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" } # ViewModels scoped to nav entries

# --- Database (Room) ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }           # Room ORM runtime - entity/DAO definitions
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }         # Room KSP annotation processor - generates DAO impls
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }           # Room migration tests (MigrationTestHelper)
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }   # Bundled SQLite so behavior is the same on every OS

# --- DI (Koin) ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin-core" }                             # Core DI container
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin-core" }                       # koinInject() in composables
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin-core" }   # koinViewModel() in composables
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin-core" }                       # androidContext() for the Android entry point

# --- Local storage (DataStore) ---
datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }                       # DataStore core
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" } # Key-value settings
ksafe = { module = "eu.anifantakis:ksafe", version.ref = "ksafe" }                                       # Encrypted storage for the willhaben session cookies

# --- Async / time ---
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }    # Structured concurrency
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" } # Main dispatcher on desktop
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }               # Date formatting
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }                        # File IO for the category tree cache

# --- Networking (Ktor) ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }                                 # Ktor HTTP client core API
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }                             # OkHttp engine (desktop + Android)
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }   # JSON bodies via kotlinx.serialization
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }                           # Request logging (redacted)
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }   # kotlinx.serialization JSON adapter

# --- Images ---
coil3-coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" } # Async loading of local listing images
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }    # Drag-to-reorder listing images

[bundles]
# DI - Koin for Compose Multiplatform
koin = [
    "koin-core",
    "koin-compose",
    "koin-compose-viewmodel",
]

# Database - Room runtime + bundled SQLite engine
room = [
    "room-runtime",
    "sqlite-bundled",
]

# Local storage - both DataStore artifacts
datastore = [
    "datastore",
    "datastore-preferences",
]

# Navigation 3 - display + ViewModel scoping
navigation3 = [
    "jetbrains-navigation3-ui",
    "jetbrains-lifecycle-viewmodel-nav3",
]

# Networking - Ktor client stack (engine is added per platform)
ktor = [
    "ktor-client-core",
    "ktor-client-content-negotiation",
    "ktor-client-logging",
    "ktor-serialization-kotlinx-json",
]

# Testing - shared test stack for unit tests
testing = [
    "kotlinx-coroutines-test",
    "turbine",
    "assertk",
    "ktor-client-mock",
]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
